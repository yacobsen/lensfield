<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#07101f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FieldTech" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Inter — production-grade system font alternative -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Field Tech Agent</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Toast notification -->
    <div id="toast" class="toast" aria-live="polite"></div>

    <div id="app">
      <!-- ── Top bar (sticky) ── -->
      <header class="app-header no-print">
        <div class="header-brand">
          <div class="header-logo">⚙</div>
          <span class="header-title">FieldTech</span>
        </div>
        <!-- Shown only in result view via JS -->
        <button id="header-new-btn" class="header-new-btn hidden" type="button">
          + New Report
        </button>
      </header>

      <!-- Print-only header -->
      <header class="print-header">
        <strong>Field Tech Agent — Field Report</strong>
        <span id="print-timestamp"></span>
      </header>

      <main>
        <!-- ── Report form ── -->
        <form id="report-form" novalidate>

          <div class="card">
            <span class="section-label">Photo</span>
            <div id="photo-area" class="photo-area">
              <img id="photo-preview" class="photo-preview hidden" alt="Captured photo" />
              <label for="photo-input" id="photo-placeholder" class="photo-placeholder">
                <span class="capture-icon">📷</span>
                <span class="photo-placeholder-title">Tap to capture</span>
                <span class="photo-placeholder-sub">JPG · PNG · HEIC</span>
              </label>
              <input
                type="file"
                id="photo-input"
                accept="image/*"
                capture="environment"
                class="visually-hidden"
              />
            </div>
            <button type="button" id="retake-btn" class="retake-btn hidden">
              ↺ Retake
            </button>
          </div>

          <div class="card">
            <label class="section-label" for="note">Field Note</label>
            <textarea
              id="note"
              rows="4"
              placeholder="Describe what you're observing — location, symptoms, anything unusual…"
            ></textarea>
          </div>

          <button type="submit" id="submit-btn" class="submit-btn" disabled>
            Analyze
          </button>
        </form>

        <!-- ── Previous reports ── -->
        <section id="history-panel" class="history-panel hidden no-print">
          <div class="history-header">
            <span class="section-label">Previous Reports</span>
            <button id="clear-history-btn" class="clear-history-btn" type="button">
              Clear all
            </button>
          </div>
          <div id="history-list" class="history-list"></div>
        </section>

        <!-- ── Result panel ── -->
        <section id="result-panel" class="result-panel hidden">
          <!-- Header card: title + risk badge -->
          <div class="result-header-card">
            <div class="result-header-left">
              <div class="result-header-title">Analysis Report</div>
              <div id="result-subtitle" class="result-subtitle"></div>
            </div>
            <span id="severity-badge" class="severity-badge"></span>
          </div>

          <!-- Dynamic sections injected by renderResult() -->
          <div id="result-content"></div>

          <!-- Action row -->
          <div class="result-actions no-print">
            <button id="copy-json-btn" class="action-btn action-btn--system" type="button"
              title="Copies structured JSON — paste into your service system or use with integrations.">
              <span class="action-btn-label">Export for System</span>
              <span class="action-btn-sub">For integrations</span>
            </button>
            <button id="copy-summary-btn" class="action-btn" type="button">
              Copy Summary
            </button>
            <button id="export-pdf-btn" class="action-btn action-btn--accent" type="button">
              Export PDF
            </button>
          </div>

          <button id="new-report-btn" class="new-report-btn no-print" type="button">
            New Report
          </button>
        </section>

        <!-- Loading overlay -->
        <div id="loading" class="loading hidden">
          <div class="spinner"></div>
          <p>Analyzing…</p>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
