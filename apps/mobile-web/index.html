<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#07101f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lensfield" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Lensfield</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="toast" class="toast" aria-live="polite"></div>

    <div id="app">
      <!-- ── Top bar ── -->
      <header class="app-header no-print">
        <div class="header-brand">
          <div class="header-logo">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </div>
          <span class="header-title">Lensfield</span>
        </div>
        <div class="header-actions">
          <button id="contrast-btn" class="contrast-btn" type="button" title="Toggle high-contrast mode" aria-label="Toggle high-contrast mode" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <line x1="12" y1="2"     x2="12" y2="5"/>
              <line x1="12" y1="19"    x2="12" y2="22"/>
              <line x1="4.22" y1="4.22"    x2="6.34" y2="6.34"/>
              <line x1="17.66" y1="17.66"  x2="19.78" y2="19.78"/>
              <line x1="2"  y1="12" x2="5"  y2="12"/>
              <line x1="19" y1="12" x2="22" y2="12"/>
              <line x1="4.22"  y1="19.78" x2="6.34"  y2="17.66"/>
              <line x1="17.66" y1="6.34"  x2="19.78" y2="4.22"/>
            </svg>
          </button>
          <button id="header-new-btn" class="header-new-btn hidden" type="button">+ New Report</button>
        </div>
      </header>

      <!-- Print header -->
      <header class="print-header">
        <strong>Lensfield — Field Service Report</strong>
        <span id="print-timestamp"></span>
      </header>

      <main>
        <form id="report-form" novalidate>

          <!-- Photos -->
          <div class="card">
            <div class="card-label">Photos</div>
            <div id="photo-slots" class="photo-slots">
              <!-- Slot 1 — primary -->
              <div class="photo-slot photo-slot--primary" data-slot="1">
                <img class="slot-preview hidden" alt="Photo 1" />
                <label class="slot-placeholder photo-area--pulse">
                  <span class="slot-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                      <circle cx="12" cy="13" r="4"/>
                    </svg>
                  </span>
                  <span class="slot-hint">Tap to capture</span>
                  <span class="slot-sub">Compressed automatically</span>
                  <input type="file" class="slot-input visually-hidden" accept="image/*" />
                </label>
                <button type="button" class="slot-retake hidden" aria-label="Remove photo 1">✕</button>
              </div>
              <!-- Slot 2 -->
              <div class="photo-slot photo-slot--secondary hidden" data-slot="2">
                <img class="slot-preview hidden" alt="Photo 2" />
                <label class="slot-placeholder">
                  <span class="slot-icon">+</span>
                  <span class="slot-hint">Add photo</span>
                  <input type="file" class="slot-input visually-hidden" accept="image/*" />
                </label>
                <button type="button" class="slot-retake hidden" aria-label="Remove photo 2">✕</button>
              </div>
              <!-- Slot 3 -->
              <div class="photo-slot photo-slot--secondary hidden" data-slot="3">
                <img class="slot-preview hidden" alt="Photo 3" />
                <label class="slot-placeholder">
                  <span class="slot-icon">+</span>
                  <span class="slot-hint">Add photo</span>
                  <input type="file" class="slot-input visually-hidden" accept="image/*" />
                </label>
                <button type="button" class="slot-retake hidden" aria-label="Remove photo 3">✕</button>
              </div>
            </div>
          </div>

          <!-- Job Context (collapsible) -->
          <div class="card card--collapsible">
            <button type="button" class="card-label card-label--toggle" id="job-toggle" aria-expanded="false" aria-controls="job-fields-body">
              <span>Job Context</span>
              <span class="label-optional">optional</span>
              <span class="toggle-add-details" aria-hidden="true">Add details</span>
            </button>
            <div id="job-fields-body" class="job-fields collapsed">
              <div class="field-group">
                <label class="field-label" for="job-id">Job ID</label>
                <input type="text" id="job-id" class="field-input" placeholder="e.g. JOB-2041" autocomplete="off" />
              </div>
              <div class="field-group">
                <label class="field-label" for="site">Site / Location</label>
                <input type="text" id="site" class="field-input" placeholder="e.g. 4th Floor Server Room" autocomplete="off" />
              </div>
              <div class="field-group">
                <label class="field-label" for="asset">Asset / Equipment</label>
                <input type="text" id="asset" class="field-input" placeholder="e.g. Carrier RTU-3" autocomplete="off" />
              </div>
            </div>
          </div>

          <!-- Field Note -->
          <div class="card">
            <div class="card-label">
              Field Note
              <span class="label-required">required</span>
            </div>
            <div class="field-group symptom-group">
              <div class="symptom-label-row">
                <label class="field-label field-label--section" for="symptom">Observed Symptom</label>
                <span class="label-optional">optional</span>
              </div>
              <select id="symptom" class="field-select">
                <option value="">— Select a symptom —</option>
                <option>Running continuously</option>
                <option>Slow to drain</option>
                <option>No hot water</option>
                <option>Making noise</option>
                <option>Leaking or dripping</option>
                <option>Not flushing fully</option>
                <option>Won't turn on or off</option>
                <option>Error code or warning light</option>
                <option>Visible damage</option>
                <option>Routine inspection</option>
                <option>Other</option>
              </select>
            </div>
            <div class="note-row">
              <textarea id="note" rows="4" placeholder="Describe what you're observing — location, symptoms, anything unusual…"></textarea>
              <button type="button" id="mic-btn" class="mic-btn" title="Tap to dictate" aria-label="Start voice dictation">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <rect x="7" y="1" width="6" height="10" rx="3" fill="currentColor"/>
                  <path d="M4 9a6 6 0 0012 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
                  <line x1="10" y1="15" x2="10" y2="19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                  <line x1="7" y1="19" x2="13" y2="19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
            <div id="record-indicator" class="record-indicator hidden">
              <span class="record-dot"></span> Listening…
            </div>
            <div class="char-count" id="char-count">0 characters</div>
          </div>

          <button type="submit" id="submit-btn" class="submit-btn" disabled>
            <span class="submit-icon">⚡</span> Analyze with AI
          </button>
        </form>

        <!-- Previous reports -->
        <section id="history-panel" class="history-panel hidden no-print">
          <div class="history-header">
            <span class="section-label">Previous Reports</span>
            <button id="clear-history-btn" class="clear-history-btn" type="button">Clear all</button>
          </div>
          <div id="history-list" class="history-list"></div>
        </section>

        <!-- Result panel -->
        <section id="result-panel" class="result-panel hidden">

          <!-- Risk + Confidence bar -->
          <div class="result-risk-bar" id="result-risk-bar">
            <div class="risk-bar-left">
              <span class="risk-label">Risk Level</span>
              <span id="severity-badge" class="severity-badge"></span>
            </div>
            <div class="risk-bar-right">
              <span class="risk-label">Confidence</span>
              <div class="confidence-wrap">
                <div class="confidence-bar-bg">
                  <div class="confidence-bar-fill" id="confidence-bar-fill"></div>
                </div>
                <span class="confidence-pct" id="confidence-pct">—</span>
              </div>
            </div>
          </div>

          <!-- Job context pills -->
          <div id="result-job-context" class="result-job-context hidden"></div>

          <!-- Subtitle (category + timestamp) -->
          <div id="result-subtitle" class="result-subtitle"></div>

          <!-- Dynamic sections -->
          <div id="result-content"></div>

          <!-- Resolution Note -->
          <div class="card resolution-note-card no-print" id="resolution-note-card">
            <div class="card-label">
              Resolution Note
              <span class="label-optional">optional</span>
            </div>
            <div class="note-row">
              <textarea id="resolution-note" rows="3" placeholder="What did you do? Describe what was fixed, replaced, or adjusted..."></textarea>
              <button type="button" id="resolution-mic-btn" class="mic-btn" title="Tap to dictate" aria-label="Start voice dictation for resolution note">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <rect x="7" y="1" width="6" height="10" rx="3" fill="currentColor"/>
                  <path d="M4 9a6 6 0 0012 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
                  <line x1="10" y1="15" x2="10" y2="19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                  <line x1="7" y1="19" x2="13" y2="19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
            <div id="resolution-record-indicator" class="record-indicator hidden">
              <span class="record-dot"></span> Listening…
            </div>
          </div>

          <!-- Actions -->
          <div class="result-actions no-print">
            <button id="customer-report-btn" class="action-btn action-btn--customer" type="button">
              <span class="action-btn-label">Customer Report</span>
            </button>
            <button id="share-btn" class="action-btn action-btn--accent" type="button">
              <span class="action-btn-label">Share Report</span>
            </button>
            <div class="more-actions-wrap">
              <button id="more-actions-btn" class="action-btn action-btn--more" type="button" aria-label="More options" aria-expanded="false">···</button>
              <div class="more-actions-menu hidden" id="more-actions-menu">
                <button id="export-pdf-btn"   class="more-menu-item" type="button">Export PDF</button>
                <button id="copy-summary-btn" class="more-menu-item" type="button">Copy Summary</button>
                <button id="copy-json-btn"    class="more-menu-item" type="button">Export for System</button>
              </div>
            </div>
          </div>

          <button id="new-report-btn" class="new-report-btn no-print" type="button">New Report</button>
        </section>

        <!-- Loading overlay -->
        <div id="loading" class="loading hidden">
          <div class="loading-inner">
            <div class="spinner"></div>
            <p class="loading-title">Analyzing…</p>
            <p class="loading-sub">Processing photo and field note with AI</p>
          </div>
        </div>
      </main>

      <!-- Customer Report modal -->
      <div id="customer-report-modal" class="customer-modal hidden" aria-modal="true" role="dialog">
        <div class="customer-modal-card">
          <div class="customer-modal-header">
            <span class="customer-modal-title">Customer Report</span>
            <button id="customer-modal-close" class="customer-modal-close" type="button" aria-label="Close">✕</button>
          </div>
          <div class="customer-modal-body">
            <div class="customer-modal-loading hidden">
              <div class="spinner"></div>
              <p class="loading-sub">Generating customer report…</p>
            </div>
            <p id="customer-modal-text" class="customer-report-text"></p>
          </div>
          <div class="customer-modal-actions">
            <button id="customer-modal-share" class="action-btn action-btn--accent" type="button">Share</button>
            <button id="customer-modal-copy" class="action-btn" type="button">Copy</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
